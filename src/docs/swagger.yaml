openapi: 3.0.3
info:
  title: eSparkTalentAPI Auth API
  version: 1.0.0
  description: API documentation for authentication and employee management routes

servers:
  - url: http://localhost:3000/api
    description: Local Development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /login:
    post:
      summary: User login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: mypassword123
      responses:
        "200":
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    type: string
                    example: user
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid credentials
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Internal server error

  /hr_home:
    get:
      tags:
        - Home Page
      summary: Get HR dashboard summary data
      description: |
        Retrieves company image, employee/client/hiring/interview stats, and user-specific permission details.
        - For `super_admin`, only the user and common counts are returned.
        - For other users, permission data and user image are also included.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard summary fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: string
                    example: admin_user
                  company_image:
                    type: string
                    example: company/image/path.png
                  user_image:
                    type: string
                    example: user/image/path.png
                  employee_perms:
                    type: object
                    additionalProperties: true
                    example: { view: true, edit: false }
                  client_perms:
                    type: object
                    additionalProperties: true
                    example: { view: true }
                  leaves_perms:
                    type: object
                    additionalProperties: true
                    example: { view: false }
                  invoices_perms:
                    type: object
                    additionalProperties: true
                  policies_perms:
                    type: object
                    additionalProperties: true
                  guides_perms:
                    type: object
                    additionalProperties: true
                  employees:
                    type: integer
                    example: 10
                  clients:
                    type: integer
                    example: 5
                  hiring_requests:
                    type: integer
                    example: 3
                  interview_schedules:
                    type: integer
                    example: 4
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Internal server error

  /hr_add_emp:
    post:
      summary: Add a new employee
      description: Adds a new employee with form-data, including image and resume file uploads.
      tags:
        - Add Employee
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - employee_id
                - first_name
                - last_name
                - gender
                - dob
                - email
                - personal_email
                - marital_status
                - emergency_contact
                - joining_date
                - role
                - job_title
                - company
                - punch_timings
                - job_status
                - phone_number
                - casual_leaves
                - sick_leaves
                - annual_leaves
                - hajj_leaves
                - paid_leaves
                - unpaid_leaves
                - password
                - confirm_password
              properties:
                employee_id:
                  type: string
                first_name:
                  type: string
                last_name:
                  type: string
                gender:
                  type: string
                dob:
                  type: string
                  format: date
                email:
                  type: string
                  format: email
                personal_email:
                  type: string
                  format: email
                marital_status:
                  type: string
                emergency_contact:
                  type: string
                joining_date:
                  type: string
                  format: date
                starting_date:
                  type: string
                  format: date
                  nullable: true
                ending_date:
                  type: string
                  format: date
                  nullable: true
                role:
                  type: string
                job_title:
                  type: string
                company:
                  type: string
                punch_timings:
                  type: string
                job_status:
                  type: string
                phone_number:
                  type: string
                casual_leaves:
                  type: integer
                sick_leaves:
                  type: integer
                annual_leaves:
                  type: integer
                hajj_leaves:
                  type: integer
                paid_leaves:
                  type: integer
                unpaid_leaves:
                  type: integer
                password:
                  type: string
                  format: password
                confirm_password:
                  type: string
                  format: password
                image:
                  type: string
                  format: binary
                resume:
                  type: string
                  format: binary
      responses:
        "201":
          description: Employee added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  id:
                    type: integer
                  image:
                    type: string
        "400":
          description: Bad Request (Validation or duplicate errors)
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /hr_emp_prof:
    get:
      tags:
        - Employee Profile, Client, Assets
      summary: Get employee profile details
      description: |
        Fetches employee details by ID. Optionally fetches tab-specific data:

        - `tab=client` returns client assignments (active and terminated)
        - `tab=assets` returns assigned asset records
        - If `tab` is omitted, returns full employee profile including a signed image URL
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: ID of the employee
          example: "1"
        - name: tab
          in: query
          required: false
          schema:
            type: string
            enum: [client, assets]
          description: Optional tab to fetch specific details
          example: "client"
      responses:
        "200":
          description: Successful response with employee data
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      id:
                        type: string
                      employee_id:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                      gender:
                        type: string
                      dob:
                        type: string
                        format: date
                      phone_number:
                        type: string
                      email:
                        type: string
                      personal_email:
                        type: string
                      marital_status:
                        type: string
                      emergency_contact:
                        type: string
                      joining_date:
                        type: string
                        format: date
                      job_title:
                        type: string
                      role:
                        type: string
                      status:
                        type: string
                      probation_started:
                        type: string
                        format: date
                      probation_ended:
                        type: string
                        format: date
                      image_path:
                        type: string
                        format: uri
                  - type: object
                    properties:
                      active_clients:
                        type: array
                        items:
                          type: object
                          properties:
                            client_name:
                              type: string
                            client_id:
                              type: string
                            job_title:
                              type: string
                            employeement_term:
                              type: string
                            join_date:
                              type: string
                      terminated_clients:
                        type: array
                        items:
                          type: object
                          properties:
                            client_name:
                              type: string
                            client_id:
                              type: string
                            job_title:
                              type: string
                            employeement_term:
                              type: string
                            join_date:
                              type: string
                  - type: object
                    properties:
                      assets:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            gadget:
                              type: string
                            asset_id:
                              type: string
                            assigned_date:
                              type: string
                            assignee_name:
                              type: string
                            assignee_email:
                              type: string
        "400":
          description: Invalid employee ID or employee/client not found
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Employee does not exist with given employee email
        "500":
          description: Server error
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Internal server error

  /hr_emps:
    get:
      tags:
        - Employees list
      summary: Get all employees for HR dashboard
      description: |
        Retrieves a list of employees along with their image, designation, and associated company.
        Excludes employees associated with the `TALENT_EMAIL` client.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of employee records
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: "1"
                    employee_id:
                      type: string
                      example: "EMP001"
                    name:
                      type: string
                      example: "John Doe"
                    image_path:
                      type: string
                      format: uri
                      example: "https://bucket-name.s3.region.amazonaws.com/image.jpg?..."
                    designation:
                      type: string
                      example: "Software Engineer"
                    company:
                      type: string
                      example: "Acme Corp"
                    active:
                      type: boolean
                      description: Whether the employee is actively outsourced to a client
                      example: true
        "204":
          description: No employees found
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Internal server error

    delete:
      tags:
        - Employees list
      summary: Delete a specific employee
      description: |
        Deletes an employee by ID. This includes:
        - Deleting associated records (e.g., end users, letters)
        - Removing resume and image files from S3
        - Deleting the main employee record
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: id
          schema:
            type: string
          required: true
          description: ID of the employee to delete
          example: "1"
      responses:
        "200":
          description: Employee deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: John Doe is removed successfully
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Employee not found
        "500":
          description: Internal server error or deletion failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Internal server error

  /emp_salary:
    post:
      tags:
        - Employee Salary # ✅ Gives proper heading in Swagger UI
      summary: Add employee salary
      description: Add salary details and pay slip for a specific employee.
      security:
        - bearerAuth: [] # ✅ Protects with JWT
      parameters:
        - in: query
          name: employee_id
          required: true
          schema:
            type: string
          example: "example@gmail.com"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                job_status:
                  type: string
                  example: "Probation"
                gross_salary:
                  type: number
                  example: 60000
                net_salary:
                  type: number
                  example: 54000
                date:
                  type: string
                  format: date # ✅ Will now require "YYYY-MM-DD"
                  example: "2025-05-15"
                tax_deduction:
                  type: number
                  example: 6000
                pay_slip:
                  type: string
                  format: binary
              required:
                - job_status
                - gross_salary
                - net_salary
                - date
                - tax_deduction
      responses:
        "201":
          description: Salary added successfully
        "400":
          description: Validation or file upload error
        "401":
          description: Unauthorized – JWT missing or invalid
        "500":
          description: Internal server error

    get:
      tags:
        - Employee Salary
      summary: Get employee salary details
      description: Fetch salary records of a specific employee, optionally filtered by month and/or year.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: employee_id
          required: true
          schema:
            type: string
          description: The email of the employee.
          example: "john.doe@example.com"

        - in: query
          name: month
          required: false
          schema:
            type: string
          description: Month to filter by (can be name like "may" or number "5").
          example: "May"

        - in: query
          name: year
          required: false
          schema:
            type: string
          description: Year to filter salary records.
          example: "2025"

      responses:
        "200":
          description: Successfully fetched salary records
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    job_status:
                      type: string
                    gross_salary:
                      type: number
                    tax_deduction:
                      type: number
                    net_salary:
                      type: number
                    date:
                      type: string
                      format: date
        "400":
          description: Invalid input (e.g., bad month or year)
        "401":
          description: Unauthorized
        "500":
          description: Internal server error

    delete:
      tags:
        - Employee Salary
      summary: Delete employee salary record
      description: Delete a specific salary record by its ID.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Salary record deleted successfully
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
        "500":
          description: Internal server error

    patch:
      tags:
        - Employee Salary
      summary: Update employee salary record
      description: Update a specific salary record by its ID.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                job_status:
                  type: string
                gross_salary:
                  type: number
                  example: 60000
                net_salary:
                  type: number
                  example: 54000
                date:
                  type: string
                  format: date
                  example: "2025-05-15"
                tax_deduction:
                  type: number
                  example: 6000
                pay_slip:
                  type: string
                  format: binary
              # required:
              # - job_status
              # - gross_salary
              # - net_salary
              # - date
              # - tax_deduction
      responses:
        "200":
          description: Salary record updated successfully
        "400":
          description: Validation or file upload error
        "401":
          description: Unauthorized
        "500":
          description: Internal server error

  /down_payslip:
    get:
      tags:
        - Employee Salary
      summary: Download Employee Salary Pay Slip
      description: Retrieves and downloads the employee’s salary pay slip PDF by salary ID.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: integer
            example: 123
          description: Salary ID (from eSparkTalentAPI_salary table)
      responses:
        "200":
          description: Pay slip PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Validation error or missing parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Salary ID is required
        "404":
          description: Pay slip or salary record not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Pay slip not found
        "401":
          description: Unauthorized – missing or invalid token
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Internal Server Error

  /emp_letters:
    post:
      tags:
        - Employee Letters
      summary: Create a new employee letter
      description: Create a new employee letter with the given details.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - email
                - objective
                - issue_date
                - letter
              properties:
                email:
                  type: string
                  format: email
                  example: "john.doe@example.com"
                objective:
                  type: string
                  example: "Resignation"
                issue_date:
                  type: string
                  format: date
                  example: "2025-05-15"
                reason:
                  type: string
                  example: "Requested by employee for visa application"
                letter:
                  type: string
                  format: binary
      responses:
        "201":
          description: Letter successfully added
          content:
            application/json:
              schema:
                type: object
              properties:
                message:
                  type: string
                  example: One new letter has been added
                id:
                  type: string
                  example: "42"
        "400":
          description: Validation error or file issue
          content:
            application/json:
              schema:
                type: object
                example:
                  email: ["Email is required"]
                  letter: ["Invalid file type"]
        "401":
          description: Unauthorized
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                type: object
                example:
                  email: ["Employee does not exist"]
        "500":
          description: Internal server error

    get:
      tags:
        - Employee Letters
      summary: Get letters for an employee by email
      description: Retrieves all letters associated with a given employee's email.
      security:
        - bearerAuth: []
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
          description: The email of the employee.
          example: john.doe@example.com
      responses:
        "200":
          description: List of letters for the employee
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    objective:
                      type: string
                      example: Employment Verification
                    email:
                      type: string
                      format: email
                      example: john.doe@example.com
                    issue_date:
                      type: string
                      format: date
                      example: 2025-05-01
                    reason:
                      type: string
                      example: For visa processing
        "400":
          description: Validation error (e.g. invalid email format)
          content:
            application/json:
              schema:
                type: object
                example:
                  email: ["Invalid email format"]
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Employee with this email not found
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Internal Server Error

    delete:
      tags:
        - Employee Letters
      summary: Delete a letter by ID
      description: Deletes a specific letter from the database using its ID.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: The ID of the letter to be deleted
          example: "23"
      responses:
        "200":
          description: Letter deleted successfully
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Letter deleted successfully
        "404":
          description: Letter not found
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Letter not found
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Internal Server Error

    patch:
      tags:
        - Employee Letters
      summary: Update an existing letter
      description: Updates a letter by its ID. Allows updating the reason, objective, issue date, or the letter file (PDF only).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
          type: string
          description: ID of the letter to update
          example: "23"
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: "Updated reason"
                letter:
                  type: string
                  format: binary
                  description: Upload a new letter file (PDF, max 5MB)
      responses:
        "200":
          description: Letter updated successfully
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Letter updated successfully
        "400":
          description: Bad request (e.g., no fields provided or file validation failed)
          content:
            application/json:
              schema:
                type: object
                example:
                  message: No fields to update
        "404":
          description: Letter not found
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Letter not found
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Internal Server Error

  /down_letter:
    get:
      tags:
        - Employee Letters
      summary: Download a letter document
      description: Downloads a letter document by its ID from S3 storage.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: id
          schema:
            type: string
          required: true
          description: Unique ID of the letter
          example: "123"
      responses:
        "200":
          description: Letter PDF file successfully downloaded
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Bad request due to validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Letter ID is required
        "401":
          description: Unauthorized – JWT token missing or invalid
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unauthorized
        "404":
          description: Letter not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Letter with this id does not exist
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Internal Server Error

  /letters:
    get:
      tags:
        - Employee Letters
      summary: Get all letters for the authenticated employee
      description: Returns a list of letters issued to the logged-in user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A list of letters associated with the user
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: "abcd1234"
                    objective:
                      type: string
                      example: "Employment Confirmation"
                    issue_date:
                      type: string
                      format: date
                      example: "2024-11-12"
        "401":
          description: Unauthorized – JWT token missing or invalid
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unauthorized
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Internal server error

  /hr_emp_benefit:
    post:
      tags:
        - Employee Benefits
      summary: Add a new employee benefit
      description: |
        Adds a benefit record for an employee and creates a corresponding notification entry.
        The employee is identified via their email (used as `employee_id`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - card_id
                - employee_id
                - benefit
                - issue_date
                - description
              properties:
                card_id:
                  type: string
                  example: card_12345
                employee_id:
                  type: string
                  description: Employee email used to identify the employee
                  example: john.doe@example.com
                benefit:
