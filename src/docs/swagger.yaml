                start_date:
                  type: string
                  format: date
                  example: "2025-06-01"
                end_date:
                  type: string
                  format: date
                  example: "2025-06-03"
                reason:
                  type: string
                  example: "Working remotely due to personal commitments"
                count:
                  type: number
                  example: 3
      responses:
