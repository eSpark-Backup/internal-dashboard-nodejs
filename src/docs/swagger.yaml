  /hr_accounts:
    post:
      tags:
        - Setting Accounts
      summary: Create a new custom account
      description: |
        Creates a new custom account with profile image upload and initializes default permissions. 
        Also ensures the provided email does not already exist in the system.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - account_name
                - email
                - password
                - confirm_password
              properties:
                account_name:
                  type: string
                  example: "HR Manager"
                email:
                  type: string
                  format: email
                  example: "hr@example.com"
                password:
                  type: string
                  format: password
                  example: "StrongPassword123!"
                confirm_password:
                  type: string
                  format: password
                  example: "StrongPassword123!"
                image:
                  type: string
                  format: binary
                  description: Optional profile image (JPEG/PNG, max 5MB)
      responses:
        "200":
          description: Account successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Account created successfully
                  id:
                    type: integer
                    example: 123
                  image:
                    type: string
                    format: uri
                    nullable: true
                    example: "https://s3.amazonaws.com/bucketname/accounts/profiles/2025-05-22_AccountImage.jpg"
        "400":
          description: Validation or email conflict error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User with this email already exists
        "500":
          description: Internal server error (S3, DB, etc.)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Internal server error

    get:
      tags:
        - Setting Accounts
      summary: Get all custom accounts
      description: |
        Retrieves a list of all custom accounts with decrypted passwords and signed image URLs.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A list of custom accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    account_name:
                      type: string
                      example: "HR Manager"
                    email:
                      type: string
                      format: email
                      example: "hr@example.com"
                    image:
                      type: string
                      format: uri
                      nullable: true
                      example: "https://s3.amazonaws.com/bucketname/accounts/profiles/2025-05-22_AccountImage.jpg"
                    password:
                      type: string
                      description: Decrypted password (used for admin display only)
                      example: "StrongPassword123!"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Internal Server Error

    delete:
      tags:
        - Setting Accounts
      summary: Delete an custom account
      description: |
        Deletes an custom account by ID. Also removes the corresponding end user and image from S3, if present.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: The ID of the account to delete
          example: "5"
      responses:
        "200":
          description: Account deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Account deleted successfully
        "404":
          description: Account or corresponding end user not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Account not found with this id
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Internal Server Error

    patch:
      tags:
        - Setting Accounts
      summary: Update an custom account
      description: |
        Updates an existing custom account by ID. Allows optional updates to account name, password, and profile image.
        Also updates the end user password in a separate table if provided.
