                    type: object
                    additionalProperties:
                      type: string
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Account not found with this id
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Internal Server Error

  /hr_emp_t&l:
    get:
      tags:
        - Employee Time & Leave
      summary: Get employee time or leave details
      description: |
        Retrieves either punch timing data (check-in/check-out) or leave balances for a specific employee.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: The ID of the employee
          example: "emp123"
        - name: tab
          in: query
          required: true
          schema:
            type: string
            enum: [time, leaves]
          description: Whether to fetch "time" or "leaves" data
          example: time
      responses:
        "200":
          description: |
            Successfully retrieved either punch timing or leave balance data
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      id:
                        type: string
                        example: emp123
                      check_in:
                        type: string
                        format: date-time
                        nullable: true
                        example: "2025-05-01T09:00:00Z"
                      check_out:
                        type: string
                        format: date-time
                        nullable: true
                        example: "2025-05-01T18:00:00Z"
                  - type: object
                    properties:
                      id:
                        type: string
                        example: emp123
                      casual_leaves:
                        type: integer
                        example: 2
                      sick_leaves:
                        type: integer
                        example: 1
                      annual_leaves:
                        type: integer
                        example: 5
                      unpaid_leaves:
                        type: integer
                        example: 0
                      paid_leaves:
                        type: integer
                        example: 3
                      hajj_leaves:
                        type: integer
                        example: 0
        "400":
          description: Invalid tab value
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid tab value
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: employee matching query does not exist.
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Something went wrong while fetching data

    patch:
      tags:
        - Employee Time & Leave
      summary: Update employee punch timings or leave balances
      description: |
        Updates either punch timings (`check_in`, `check_out`) or leave balances for a specific employee based on the `tab` query parameter.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: ID of the employee
          example: "emp123"
        - name: tab
          in: query
          required: true
          schema:
            type: string
            enum: [time, leaves]
          description: Determines whether the update is for punch timings or leave balances
          example: time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  description: Update punch timings
                  properties:
                    check_in:
                      type: string
                      pattern: "^(0[1-9]|1[0-2]):[0-5][0-9] (AM|PM)$"
                      example: "09:00 AM"
                    check_out:
                      type: string
                      pattern: "^(0[1-9]|1[0-2]):[0-5][0-9] (AM|PM)$"
                      example: "05:00 PM"
                - type: object
                  description: Update leave balances (values should be JSON objects)
                  properties:
                    casual_leaves:
                      type: object
                      example: { "total": 5, "used": 2 }
                    sick_leaves:
                      type: object
                      example: { "total": 3, "used": 1 }
                    annual_leaves:
                      type: object
                      example: { "total": 10, "used": 4 }
                    unpaid_leaves:
                      type: object
                      example: { "total": 0, "used": 0 }
                    paid_leaves:
                      type: object
                      example: { "total": 6, "used": 2 }
                    hajj_leaves:
                      type: object
                      example: { "total": 1, "used": 0 }
      responses:
        "200":
          description: Successfully updated employee data
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Timings updated successfully
        "400":
          description: Bad request or validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: No timing fields provided to update
        "404":
          description: Employee or leave balance record not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Employee record not found
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unexpected server error occurred

  /emp_wfhr:
