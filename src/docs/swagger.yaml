  /hr_empattendance:
    get:
      summary: Get Employee Attendance Records
      description: |
        Retrieves attendance records of an employee using email with optional filters for date range, status, check-in/out time ranges.
      tags:
        - Employee Attendance
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: e_email
          required: true
          schema:
            type: string
            format: email
          description: Email of the employee
        - in: query
          name: from
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$' 
            example: "2024-01-01"
          description: Start date in YYYY-MM-DD format
        - in: query
          name: to
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
            example: "2024-01-01"
          description: End date in YYYY-MM-DD format
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [present, absent, missing, day_off, full_leave, short_duration, wfh]
          description: Filter by attendance status
        - in: query
          name: checkInFrom
          required: false
          schema:
            type: string
            example: "09:00:00 AM"
          description: Start time range for check-in (24h format)
        - in: query
          name: checkInTo
          required: false
          schema:
            type: string
            example: "10:00:00 AM"
          description: End time range for check-in (24h format)
        - in: query
          name: checkOutFrom
          required: false
          schema:
            type: string
            example: "17:00:00 PM"
          description: Start time range for check-out (24h format)
        - in: query
          name: checkOutTo
          required: false
          schema:
            type: string
            example: "18:00:00 PM"
          description: End time range for check-out (24h format)
      responses:
        '200':
          description: Attendance records retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      time_sheet:
                        type: object
                        properties:
                          id:
                            type: integer
                          month:
                            type: string
                          year:
                            type: integer
                          record:
                            type: object
                            additionalProperties:
                              type: object
                              properties:
                                check_in:
                                  type: string
                                  example: "09:30"
                                check_out:
                                  type: string
                                  example: "17:30"
                                status:
                                  type: object
                          expect_check_in:
                            type: string
                          expect_check_out:
                            type: string
                      employee_details:
                        type: object
                        properties:
                          employee_id:
                            type: string
                          employee_name:
                            type: string
                          company:
                            type: string
                          company_email:
                            type: string
                          location:
                            type: string
                          role_type:
                            type: string
                          job_title:
                            type: string
                          joining_date:
                            type: string
        '204':
          description: No attendance records found
        '400':
          description: Validation error
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Employee not found.
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Internal server error.





