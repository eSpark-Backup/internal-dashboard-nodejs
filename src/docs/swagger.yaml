                  type: string
                  format: binary
                  description: JPEG or PNG image (max 5MB)
      responses:
        "200":
          description: Account updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Account updated successfully
        "400":
          description: Invalid input (e.g., file validation error or update failure)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid file format or size
