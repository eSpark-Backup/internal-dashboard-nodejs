          description: Validation error or failed insert
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Failed to add WFH request
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Employee not found
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Internal server error

    get:
      tags:
        - WFH Requests
      summary: Get WFH requests for the authenticated employee
      description: |
        Returns a list of Work From Home (WFH) requests for the authenticated employee. 
        Supports optional filtering by status tab and created_at date range.
      security:
        - bearerAuth: []
      parameters:
        - name: tab
          in: query
          required: false
          schema:
            type: string
            enum: [pending, completed, rejected]
          description: Filter by request status
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter requests created on or after this date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter requests created on or before this date
      responses:
        "200":
          description: A list of WFH requests and counts by status
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: "wr123"
                        employee_id:
                          type: string
                          format: email
                          example: "john.doe@example.com"
                        employee_name:
                          type: string
                          example: "John Doe"
                        department:
                          type: string
                          example: "Engineering"
                        start_date:
                          type: string
                          format: date
                          example: "2025-06-01"
                        end_date:
                          type: string
                          format: date
                          example: "2025-06-03"
                        count:
                          type: number
                          example: 3
                        status:
                          type: string
                          example: "pending"
                        reason:
                          type: string
                          example: "Personal reasons"
                        created_at:
                          type: string
                          format: date-time
                          example: "2025-06-01T10:00:00Z"
                  pending:
                    type: integer
                    example: 2
                  rejected:
                    type: integer
                    example: 1
                  completed:
                    type: integer
                    example: 4
                  all:
                    type: integer
                    example: 7
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Employee not found
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Internal server error

    delete:
